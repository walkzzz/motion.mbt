name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (fmt / check deny-warn / mbti)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update registry index
        run: moon update

      - name: Moon version
        run: moon version

      - name: Format check
        run: moon fmt --check

      - name: Check compilation (4 targets, deny warnings)
        run: |
          moon check --deny-warn --target native
          moon check --deny-warn --target wasm-gc
          moon check --deny-warn --target js
          moon check --deny-warn --target wasm

      - name: API contract (mbti drift must not pass)
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Run summary
        run: |
          echo "## motion CI quality gates summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| moon fmt --check | ✅ pass |" >> $GITHUB_STEP_SUMMARY
          echo "| moon check --deny-warn × 4 targets | ✅ pass |" >> $GITHUB_STEP_SUMMARY
          echo "| mbti API contract drift | ✅ pass |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Modules: motion.core / motion.gbz185 / motion.bind / motion.reaction / motion.security" >> $GITHUB_STEP_SUMMARY
          echo "Test matrix: native / wasm-gc / js / wasm (test job)" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, js, wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update registry index
        run: moon update

      - name: Run tests (${{ matrix.target }})
        run: moon test --target ${{ matrix.target }}
